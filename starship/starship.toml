format = """
[](bg:#030B16 fg:#7DF9AA)\
[󰀵 ](bg:#7DF9AA fg:#090c0c)\
[](fg:#7DF9AA bg:#1C3A5E)\
[](fg:#1C3A5E bg:#3B76F0)\
$directory\
[](fg:#3B76F0 bg:#FCF392)\
$git_branch\
$git_status\
$git_metrics\
[](fg:#FCF392 bg:#030B16)\
$fill\
[](fg:#FCF392 bg:transparent)\
$aws\
[](fg:#FCF392 bg:transparent)\
 [](bg:transparent fg:#68032f)\
$time\
[](fg:#68032f bg:transparent)\
 $cmd_duration\
$line_break\
$character\
"""

[directory]
format = "[ ﱮ $path ]($style)"
style = "fg:#E4E4E4 bg:#3B76F0"

[git_branch]
format = '[ $symbol$branch(:$remote_branch) ]($style)'
symbol = "  "
style = "fg:#1C3A5E bg:#FCF392"

[git_status]
format = '[$all_status ]($style)'
style = "fg:#1C3A5E bg:#FCF392"
conflicted = "[=](bold fg:white bg:red)"
untracked = "[?](bold fg:white bg:blue)"
modified = "[!](bold fg:white bg:blue)"
staged = "[+](bold fg:white bg:green)"
renamed = "[»](bold fg:white bg:blue)"
deleted = "[✘](bold fg:white bg:blue)"
stashed = "[≡](bold fg:white bg:purple)"
ahead = "[⇡](bold fg:white bg:green)"
behind = "[⇣](bold fg:white bg:red)"
diverged = "[⇕](bold fg:white bg:blue)"

[git_metrics]
format = "([+$added]($added_style))[]($added_style)"
added_style = "fg:#1C3A5E bg:#FCF392"
deleted_style = "fg:bright-red bg:235"
disabled = false

[hg_branch]
format = "[ $symbol$branch ]($style)"
symbol = " "

[character]
success_symbol = '[ ➜](bold green) '
error_symbol = '[ ✗](#E84D44) '

[memory_usage]
symbol = "󰍛"

[fill]
symbol = ' '

[time]
disabled = false
time_format = "%R"
style = "bg:#1d2230"
format = '[[ 󱑍 $time ](bg:#1C3A5E fg:#8DFBD2)]($style)'

[cmd_duration]
format = "[  $duration ]($style)"
style = "fg:bright-white bg:18"
show_notifications = true
min_time_to_notify = 30_000

[aws]
format = '[ 󰅟 ($profile )(\($region\) )(\[$duration\]) ]($style)'
style = "fg:#111111 bg:#E67E22"
symbol = ""
expiration_symbol = "⚠"
force_display = false

[aws.profile_aliases]

[aws.region_aliases]
us-east-1 = "us-e-1"
us-west-2 = "us-w-2"
